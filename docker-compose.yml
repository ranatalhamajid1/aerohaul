services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: truck-router-backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=production-secure-random-key-change-me
      - ALLOWED_HOSTS=*
      - CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:5173,http://localhost:80
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: truck-router-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: truck-router-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
